name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[mcp,dev]"
      - run: ruff check src tests scripts
      - run: pytest -q
      - name: Wiki health (frontmatter, claims, links, source drift)
        run: dpwiki status --strict
