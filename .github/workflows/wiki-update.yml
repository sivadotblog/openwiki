name: Wiki update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1-5" # weekdays 09:00 UTC

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wiki-update
  cancel-in-progress: false

jobs:
  update:
    # Scheduled runs need an explicit opt-in so forks do not arm a job that needs a model key.
    if: github.event_name == 'workflow_dispatch' || vars.DPWIKI_ENABLE_SCHEDULED_UPDATE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Real deployments: check out the platform repos into the paths wiki.toml points at.
      # - uses: actions/checkout@v4
      #   with:
      #     repository: your-org/platform-infra
      #     path: sources/repos/platform-infra
      #     token: ${{ secrets.SOURCES_READ_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Update wiki
        id: dpwiki
        continue-on-error: true
        run: dpwiki update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # DPWIKI_MODEL: claude-opus-5-5

      - name: Drop transient run state
        if: ${{ !cancelled() }}
        run: rm -f wiki/.run.json

      - name: Open pull request
        if: ${{ !cancelled() }}
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: wiki
          branch: wiki/update
          commit-message: "wiki: update"
          title: "wiki: update"
          body: |
            Automated dpwiki update. Result: ${{ steps.dpwiki.outcome }}

            Review the page diffs and the claim changes in `wiki/.claims/`.
            When the result is `failure`, only pages finished before the failure are included.

      - name: Propagate failure
        if: ${{ steps.dpwiki.outcome == 'failure' }}
        run: exit 1
