[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dpwiki"
version = "0.1.0"
description = "Agent-maintained knowledge base for a data platform team. Prototype inspired by langchain-ai/openwiki."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Siva" }]
dependencies = [
  "anthropic>=0.40",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
dpwiki = "dpwiki.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dpwiki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
